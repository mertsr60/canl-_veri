name: Auto Fetch Weather

on:
  schedule:
    - cron: '*/5 * * * *'   # Her 5 dakikada bir (GitHub'ın minimumu)
  workflow_dispatch:        # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Weather
        run: python .github/scripts/fetch_weather.py

      - name: Commit and Push
        env:
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
        run: |
          git config user.email "$GIT_USER_EMAIL"
          git config user.name "$GIT_USER_NAME"
          git add data/
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "weather: 20 sehir guncellendi [$(date -u '+%Y-%m-%d %H:%M')]"
            git push
          fi
